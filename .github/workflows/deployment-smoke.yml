name: Deployment smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ vars.DEPLOYMENT_SMOKE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke explicit deployment target
        run: npm run smoke:deployment -- "$DEPLOYMENT_SMOKE_URL"
        env:
          DEPLOYMENT_SMOKE_URL: ${{ vars.DEPLOYMENT_SMOKE_URL }}
