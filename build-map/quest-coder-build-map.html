<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quest Coder sprint build map</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d1f24;--soft:#5d6470;--line:#d9d5cc;--edge:#9aa0aa;--ready:#e9a400;--done:#3f9a4a;--crit:#d6452f}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2026;--ink:#eceef2;--soft:#a9b0bb;--line:#2e333b;--edge:#6c737e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}main{max-width:1500px;margin:0 auto;padding:18px}h1{margin:0 0 4px;font-size:clamp(26px,4vw,42px)}.sub{color:var(--soft);max-width:90ch;margin:0 0 14px}.top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.stat b{font-size:24px}.stat span{display:block;color:var(--soft);font-size:13px}button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}@media(max-width:1000px){.layout{grid-template-columns:1fr}}.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:78vh}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px}.panel h2{margin:0 0 8px}.panel p,.small{color:var(--soft)}.chip{display:inline-block;margin:3px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px}.node{cursor:pointer}.dim{opacity:.18}
</style></head><body><main><h1>Quest Coder sprint build map</h1><p class="sub">Sprint/milestone dependency graph derived from the PRD. Time runs left to right. Diamonds/gates mark milestone checks. Click a card to see blockers and unlocks. Progress is saved in this browser only.</p>
<div class="top"><div class="stat"><b id="done">0</b><span>done</span></div><div class="stat"><b id="ready">0</b><span>ready now</span></div><div class="stat"><b id="crit">0</b><span>critical path left</span></div></div>
<p><button id="all" aria-pressed="true">Show all</button> <button id="rdy">Ready now</button> <button id="cp">Critical path</button> <button id="reset">Reset progress</button></p>
<div class="layout"><div class="mapwrap"><svg id="map"></svg></div><aside class="panel" id="panel"></aside></div>
<script>
const PHASES=[{"id": "D", "name": "Decisions", "color": "#b5536b"}, {"id": "S0", "name": "Sprint 0 \u00b7 Foundation", "color": "#6f8f72"}, {"id": "S1", "name": "Sprint 1 \u00b7 Server engine", "color": "#2f6fd6"}, {"id": "S2", "name": "Sprint 2 \u00b7 Replay shell", "color": "#7a4fd0"}, {"id": "S3", "name": "Sprint 3 \u00b7 Pack pipeline", "color": "#14897d"}, {"id": "S4", "name": "Sprint 4 \u00b7 Personal loop", "color": "#c98a12"}, {"id": "S5", "name": "Sprint 5 \u00b7 First library", "color": "#3f9a4a"}, {"id": "S6", "name": "Sprint 6 \u00b7 Reinforcement", "color": "#e09b2d"}, {"id": "S7", "name": "Sprint 7 \u00b7 Public hardening", "color": "#d6452f"}, {"id": "S8", "name": "Sprint 8 \u00b7 Rewards/social", "color": "#6b7280"}];
const N=[{"id": "d-stack", "ph": "D", "k": "decision", "t": "Decide MVP stack", "deps": [], "d": "Choose React/TS + server CPython + Postgres or alternative."}, {"id": "d-library", "ph": "D", "k": "decision", "t": "Pick first library order", "deps": [], "d": "Choose first 5 questions and whether to follow NeetCode order."}, {"id": "d-review", "ph": "D", "k": "decision", "t": "Set review intervals", "deps": [], "d": "Initial stale-review and surprise-battle timing."}, {"id": "d-rewards", "ph": "D", "k": "decision", "t": "Reward placeholder", "deps": [], "d": "Gold/EXP/items placeholder; full system deferred."}, {"id": "d-name", "ph": "D", "k": "decision", "t": "Name decision", "deps": [], "d": "Keep Quest Coder for MVP or choose real name."}, {"id": "s0-arch", "ph": "S0", "k": "task", "t": "Architecture docs", "deps": ["d-stack"], "d": "Write architecture, runtime boundaries, repo skeleton."}, {"id": "s0-timeline", "ph": "S0", "k": "task", "t": "Timeline contract draft", "deps": ["s0-arch"], "d": "Line, variables, reads, moves, outcome, cap/compression."}, {"id": "s0-pack-schema", "ph": "S0", "k": "task", "t": "Quest-pack schema draft", "deps": ["s0-arch", "d-library"], "d": "Metadata, story, quests, tests, budgets, boss, scenes, review set."}, {"id": "g0", "ph": "S0", "k": "gate", "t": "Gate 0: decisions locked", "deps": ["d-stack", "d-library", "d-review", "d-rewards", "d-name", "s0-timeline", "s0-pack-schema"], "d": "Sprint 0 complete."}, {"id": "s1-sandbox", "ph": "S1", "k": "task", "t": "Sandbox runner prototype", "deps": ["g0"], "d": "Isolated CPython runner with no network/read-only/time/memory limits prototype."}, {"id": "s1-results", "ph": "S1", "k": "task", "t": "Four result types", "deps": ["s1-sandbox"], "d": "Did not compile, crashed, failed test, passed."}, {"id": "s1-reads", "ph": "S1", "k": "task", "t": "Read-counting wrappers", "deps": ["s1-sandbox"], "d": "Exact read budgets for lists/arrays."}, {"id": "s1-trace", "ph": "S1", "k": "task", "t": "sys.settrace timeline", "deps": ["s1-sandbox", "s0-timeline"], "d": "Line number + locals + reads from real Python frames."}, {"id": "s1-twopass", "ph": "S1", "k": "task", "t": "Two-pass execution", "deps": ["s1-reads", "s1-trace"], "d": "Fast pass/fail first, trace replay tests second."}, {"id": "s1-timequake", "ph": "S1", "k": "task", "t": "Timequake boss on server", "deps": ["s1-results", "s1-twopass", "s0-pack-schema"], "d": "Search in Rotated Sorted Array runs with server timelines."}, {"id": "g1", "ph": "S1", "k": "gate", "t": "Gate 1: engine proven", "deps": ["s1-timequake"], "d": "Reference passes, linear scan budget-fails, failure modes are distinct."}, {"id": "s2-shell", "ph": "S2", "k": "task", "t": "Replay web shell", "deps": ["g1"], "d": "Question page, runner bridge, timeline player."}, {"id": "s2-editor", "ph": "S2", "k": "task", "t": "Code editor", "deps": ["s2-shell"], "d": "Line numbers, auto-indent, tab handling, ligatures off, Cmd/Ctrl+Enter."}, {"id": "s2-scenes", "ph": "S2", "k": "task", "t": "Array scene renderer", "deps": ["s2-shell"], "d": "Doors for small inputs, skyline for large inputs."}, {"id": "s2-outcomes", "ph": "S2", "k": "task", "t": "Outcome visuals", "deps": ["s2-scenes"], "d": "Found/not found/wrong/crash/compile/off-end/loop/budget."}, {"id": "s2-controls", "ph": "S2", "k": "task", "t": "Replay controls", "deps": ["s2-shell"], "d": "Play, pause, step, back, skip, 0.5x\u20134x."}, {"id": "g2", "ph": "S2", "k": "gate", "t": "Gate 2: replay shell works", "deps": ["s2-editor", "s2-outcomes", "s2-controls"], "d": "Passing and failing run replays match timeline."}, {"id": "s3-validator", "ph": "S3", "k": "task", "t": "Pack validator", "deps": ["g2", "s0-pack-schema"], "d": "Run refs, render scenes, reject broken packs."}, {"id": "s3-loader", "ph": "S3", "k": "task", "t": "Pack loader", "deps": ["s3-validator"], "d": "Load validated pack without app-code changes."}, {"id": "s3-timequake-pack", "ph": "S3", "k": "task", "t": "Timequake pack conversion", "deps": ["s3-loader"], "d": "Convert dojo into production quest pack."}, {"id": "s3-original-text", "ph": "S3", "k": "task", "t": "Original text checklist", "deps": ["s3-validator"], "d": "No copied LeetCode/NeetCode text."}, {"id": "g3", "ph": "S3", "k": "gate", "t": "Gate 3: content pipeline", "deps": ["s3-timequake-pack", "s3-original-text"], "d": "A valid pack loads and runs end-to-end."}, {"id": "s4-auth", "ph": "S4", "k": "task", "t": "Accounts/login", "deps": ["g3"], "d": "Sign up, log in/out, persistent sessions."}, {"id": "s4-db", "ph": "S4", "k": "task", "t": "Database schema", "deps": ["g3"], "d": "Content + player progress tables."}, {"id": "s4-api", "ph": "S4", "k": "task", "t": "API server", "deps": ["s4-auth", "s4-db", "g1"], "d": "Runs, saved code, attempts, progress."}, {"id": "s4-library", "ph": "S4", "k": "task", "t": "Library UI", "deps": ["s4-api"], "d": "Browse by category/status/difficulty."}, {"id": "s4-quest-flow", "ph": "S4", "k": "task", "t": "Quest unlock flow", "deps": ["s4-api", "s2-editor"], "d": "Quests unlock in order; solution scroll recorded."}, {"id": "s4-boss", "ph": "S4", "k": "task", "t": "Boss fight + victory replay", "deps": ["s4-quest-flow", "s2-outcomes"], "d": "Each test is a round; win unlocks replay."}, {"id": "g4", "ph": "S4", "k": "gate", "t": "Gate 4: personal MVP loop", "deps": ["s4-library", "s4-boss"], "d": "Eric can clear one full question across sessions."}, {"id": "s5-linked-scene", "ph": "S5", "k": "task", "t": "Linked-list portal scene", "deps": ["g4"], "d": "Nodes as islands/portals; pointer travel and relinks animate."}, {"id": "s5-packs", "ph": "S5", "k": "task", "t": "First linked-list packs", "deps": ["s5-linked-scene", "s3-validator", "d-library"], "d": "Reverse LL, Merge Two Lists, Linked List Cycle."}, {"id": "s5-five", "ph": "S5", "k": "task", "t": "Five questions cleared", "deps": ["s5-packs"], "d": "Clear 5 questions end to end."}, {"id": "g5", "ph": "S5", "k": "gate", "t": "Gate 5: personal MVP target", "deps": ["s5-five"], "d": "Personal-stage success metric achieved."}, {"id": "s6-stale", "ph": "S6", "k": "task", "t": "Stale reviews", "deps": ["g5", "d-review"], "d": "Spaced repetition rematches."}, {"id": "s6-variants", "ph": "S6", "k": "task", "t": "Review variants", "deps": ["g5"], "d": "Pack variants for reviews/surprises."}, {"id": "s6-surprise", "ph": "S6", "k": "task", "t": "Surprise battles", "deps": ["s6-stale", "s6-variants"], "d": "Unannounced topic battles."}, {"id": "s6-stats", "ph": "S6", "k": "task", "t": "Topic stats", "deps": ["g5"], "d": "Defeated, attempts, hint/solution use, streak/rating."}, {"id": "g6", "ph": "S6", "k": "gate", "t": "Gate 6: reinforcement works", "deps": ["s6-surprise", "s6-stats"], "d": "Reviews and stats update from real play."}, {"id": "s7-hardening", "ph": "S7", "k": "task", "t": "Sandbox hardening", "deps": ["g6"], "d": "Container/microVM isolation, limits, no network."}, {"id": "s7-ratelimit", "ph": "S7", "k": "task", "t": "Rate limits + abuse protection", "deps": ["s7-hardening"], "d": "Protect API and sandbox capacity."}, {"id": "s7-public-signup", "ph": "S7", "k": "task", "t": "Public signup/onboarding", "deps": ["s7-ratelimit", "d-name"], "d": "Scale beyond builder."}, {"id": "s7-public-audit", "ph": "S7", "k": "task", "t": "Public content audit", "deps": ["g6"], "d": "All problem text original."}, {"id": "g7", "ph": "S7", "k": "gate", "t": "Gate 7: public launch", "deps": ["s7-public-signup", "s7-public-audit"], "d": "Safe enough for other interview-prep learners."}, {"id": "s8-rewards", "ph": "S8", "k": "task", "t": "Rewards system", "deps": ["g7", "d-rewards"], "d": "Quest/boss rewards and spend target."}, {"id": "s8-social", "ph": "S8", "k": "task", "t": "Stat bar + friends", "deps": ["g7"], "d": "Deferred social shell."}];
const by=Object.fromEntries(N.map(n=>[n.id,n])); N.forEach(n=>n.out=[]); N.forEach(n=>n.deps.forEach(d=>by[d].out.push(n.id)));
const st=JSON.parse(localStorage.qcSprintStatus||'{}'); const stat=id=>st[id]||'todo'; const done=id=>stat(id)==='done'; const ready=id=>!done(id)&&by[id].deps.every(done);
let sel='g0', mode='all'; const phase=Object.fromEntries(PHASES.map(p=>[p.id,p]));
function depth(id,m={}){if(m[id]!=null)return m[id];return m[id]=by[id].deps.length?Math.max(...by[id].deps.map(d=>depth(d,m)))+1:0} N.forEach(n=>n.col=depth(n.id));
function critical(){const memo={},prev={};function L(id){if(memo[id]!=null)return memo[id];let best=0,bp=null;by[id].deps.forEach(d=>{let v=L(d);if(v>best){best=v;bp=d}});prev[id]=bp;return memo[id]=best+(done(id)?0:1)}L('g7');let s=new Set(),cur='g7';while(cur){s.add(cur);cur=prev[cur]&&L(prev[cur])>0?prev[cur]:null}return s}
function setStatus(id,v){if(v==='todo')delete st[id];else st[id]=v;localStorage.qcSprintStatus=JSON.stringify(st);render()}
function render(){const W=260*(Math.max(...N.map(n=>n.col))+1)+170,H=1200,lanes=PHASES.map((p,i)=>({...p,y:40+i*110,h:100})); let counts={};N.forEach(n=>{counts[n.ph+':'+n.col]=(counts[n.ph+':'+n.col]||0)+1;n.slot=counts[n.ph+':'+n.col]-1});let cp=critical();let lit=null;if(mode==='ready')lit=new Set(N.filter(n=>ready(n.id)).map(n=>n.id));if(mode==='crit')lit=cp;let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs>`;lanes.forEach(l=>{s+=`<rect x="0" y="${l.y}" width="${W}" height="${l.h}" fill="${l.color}22"/><rect x="0" y="${l.y}" width="6" height="${l.h}" fill="${l.color}"/><text x="16" y="${l.y+56}" fill="${l.color}" font-weight="700">${l.name}</text>`});N.forEach(n=>{n.x=150+n.col*260;n.y=phase[n.ph]?lanes.find(l=>l.id===n.ph).y+14+n.slot*34:40;n.cy=n.y+28});N.forEach(n=>n.deps.forEach(d=>{let a=by[d];s+=`<path d="M${a.x+190} ${a.cy} C ${(a.x+n.x)/2+80} ${a.cy} ${(a.x+n.x)/2+80} ${n.cy} ${n.x-8} ${n.cy}" fill="none" stroke="var(--edge)" marker-end="url(#a)" class="${lit&&!(lit.has(n.id)&&lit.has(d))?'dim':''}"/>`}));N.forEach(n=>{let c=phase[n.ph].color, ds=n.k==='gate'?'stroke-dasharray="7 4"':n.k==='decision'?'stroke-dasharray="2 3"':'';let stroke=sel===n.id?'var(--ink)':ready(n.id)?'var(--ready)':c;s+=`<g class="node ${lit&&!lit.has(n.id)?'dim':''}" onclick="sel='${n.id}';render()"><rect x="${n.x}" y="${n.y}" width="190" height="56" rx="${n.k==='gate'?4:10}" fill="var(--panel)" stroke="${stroke}" stroke-width="${sel===n.id?3:1.7}" ${ds}/><text x="${n.x+10}" y="${n.y+23}" font-size="13" font-weight="700" fill="var(--ink)">${n.t.length>24?n.t.slice(0,23)+'…':n.t}</text><text x="${n.x+10}" y="${n.y+42}" font-size="11" fill="var(--soft)">${stat(n.id)==='done'?'done':ready(n.id)?'ready':n.k}</text></g>`});s+='</svg>';document.getElementById('map').outerHTML=s;document.querySelector('svg').id='map';document.getElementById('done').textContent=N.filter(n=>done(n.id)).length+' / '+N.length;document.getElementById('ready').textContent=N.filter(n=>ready(n.id)).length;document.getElementById('crit').textContent=cp.size;let n=by[sel];document.getElementById('panel').innerHTML=`<p class="small">${phase[n.ph].name} · ${n.k}</p><h2>${n.t}</h2><p>${n.d}</p><p><button onclick="setStatus('${n.id}','todo')">To do</button> <button onclick="setStatus('${n.id}','doing')">Doing</button> <button onclick="setStatus('${n.id}','done')">Done</button></p><h3>Needs first</h3>${n.deps.length?n.deps.map(id=>`<span class='chip'>${done(id)?'✓ ':''}${by[id].t}</span>`).join(''):'<p class=small>Nothing.</p>'}<h3>Unlocks</h3>${n.out.length?n.out.map(id=>`<span class='chip'>${by[id].t}</span>`).join(''):'<p class=small>Nothing.</p>'}`;}
document.getElementById('all').onclick=()=>{mode='all';render()};document.getElementById('rdy').onclick=()=>{mode='ready';render()};document.getElementById('cp').onclick=()=>{mode='crit';render()};document.getElementById('reset').onclick=()=>{for(const k in st)delete st[k];localStorage.qcSprintStatus=JSON.stringify(st);render()};render();
</script></main></body></html>
